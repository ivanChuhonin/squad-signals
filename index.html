<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Signals</title>
<style>

    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* blue */
    --series-2:       #eb6834; /* orange */
    --series-3:       #1baf7a; /* aqua */
    --series-4:       #eda100; /* yellow */
    --series-5:       #e87ba4; /* magenta */
    --status-critical:#d03b3b;
    --status-good:    #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c98500;
      --series-5:       #d55181;
      --status-critical:#e66767;
      --status-good:    #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --series-5:       #d55181;
    --status-critical:#e66767;
    --status-good:    #0ca30c;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  body { padding: 16px 16px 32px; max-width: 640px; margin: 0 auto; }

  .wordmark { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; color: var(--series-1); margin: 0 0 6px; }
  h1 { font-size: 18px; margin: 0 0 2px; text-wrap: balance; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 14px;
    border-bottom: 1px solid var(--gridline);
    overflow-x: auto;
  }
  .tab-btn {
    appearance: none; border: none; background: none;
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    padding: 8px 10px; cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-btn[aria-selected="true"] {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
  }
  .tab-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 6px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card .desc { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .bar-label { font-size: 11px; fill: var(--text-primary); }
  .bar-value { font-size: 11px; font-weight: 600; fill: var(--text-primary); }
  .bar-sub   { font-size: 10px; fill: var(--text-muted); }
  .axis-line { stroke: var(--baseline); stroke-width: 1; }

  .bar-hit { fill: transparent; cursor: pointer; }
  .bar-hit:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }

  .callout {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 11.5px; color: var(--text-secondary);
    background: color-mix(in srgb, var(--status-critical) 10%, transparent);
    border-radius: 8px; padding: 8px 10px; margin: 8px 0 12px;
  }
  .callout .icon { color: var(--status-critical); font-weight: 700; line-height: 1.3; }

  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-secondary); margin: 0 0 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 11.5px;
    line-height: 1.35;
    padding: 6px 9px;
    border-radius: 6px;
    max-width: 220px;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity 0.08s ease;
    z-index: 10;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip b { font-weight: 700; }

  .table-toggle {
    background: none; border: none; font: inherit; font-size: 11.5px;
    color: var(--text-secondary); text-decoration: underline; cursor: pointer;
    padding: 0 0 10px;
  }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; display: none; }
  table.data-table.visible { display: table; }
  table.data-table th, table.data-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--gridline); }
  table.data-table td:not(:first-child), table.data-table th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }

  footer { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

  .axis-label { font-size: 10px; fill: var(--text-muted); }
  .median-line { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; }
  .quadrant-label { font-size: 9.5px; fill: var(--text-muted); font-weight: 600; }
  .dot-hit { fill: transparent; cursor: pointer; }
  .dot-hit:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .radar-grid { stroke: var(--gridline); stroke-width: 1; fill: none; }
  .radar-ref { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
  .radar-axis-label { font-size: 10.5px; fill: var(--text-secondary); }
</style>
</head>

const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function text(str, x, y, cls, anchor, parent) {
  const t = el("text", { x, y, class: cls, "text-anchor": anchor || "start" }, parent);
  t.textContent = str;
  return t;
}
// Horizontal bar path: rounded on the value-end (right), square at the baseline (left).
function roundedBarPath(x0, x1, y, h, r) {
  const w = Math.max(x1 - x0, 0);
  r = Math.min(r, w, h / 2);
  if (w <= 0) return `M ${x0} ${y} L ${x0} ${y + h} Z`;
  return [
    `M ${x0} ${y}`,
    `L ${x1 - r} ${y}`,
    `Q ${x1} ${y} ${x1} ${y + r}`,
    `L ${x1} ${y + h - r}`,
    `Q ${x1} ${y + h} ${x1 - r} ${y + h}`,
    `L ${x0} ${y + h}`,
    "Z"
  ].join(" ");
}

const tooltipEl = document.getElementById("tooltip");
function showTooltip(evt, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add("visible");
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const pt = evt.touches ? evt.touches[0] : evt;
  tooltipEl.style.left = pt.clientX + "px";
  tooltipEl.style.top = (pt.clientY - 12) + "px";
}
function hideTooltip() { tooltipEl.classList.remove("visible"); }

function wireHover(hitEl, label, valueHtml) {
  const html = `<b>${valueHtml}</b><br>${label}`;
  hitEl.addEventListener("pointerenter", (e) => showTooltip(e, html));
  hitEl.addEventListener("pointermove", moveTooltip);
  hitEl.addEventListener("pointerleave", hideTooltip);
  hitEl.addEventListener("focus", (e) => showTooltip(e, html));
  hitEl.addEventListener("blur", hideTooltip);
}

// Single-series horizontal bar chart.
function renderBarChart(container, items, opts) {
  const rowH = 40, barH = 20, leftPad = 4, rightPad = 54, topPad = 8;
  const width = 600;
  const chartW = width - leftPad - rightPad;
  const height = topPad + items.length * rowH;
  const maxVal = Math.max(...items.map(opts.value)) * 1.15;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": opts.ariaLabel || "" }, container);

  items.forEach((d, i) => {
    const y = topPad + i * rowH;
    const val = opts.value(d);
    const barW = (val / maxVal) * chartW;
    const color = opts.color ? opts.color(d, i) : "var(--series-1)";

    text(opts.label(d), leftPad, y + 13, "bar-label", "start", svg);

    const path = el("path", { d: roundedBarPath(leftPad, leftPad + barW, y + 16, barH, 4), fill: color }, svg);
    text(opts.valueLabel(d), leftPad + barW + 6, y + 30, "bar-value", "start", svg);

    const hit = el("rect", { x: 0, y, width: width, height: rowH, class: "bar-hit", tabindex: "0", role: "button", "aria-label": `${opts.label(d)}: ${opts.valueLabel(d)}` }, svg);
    wireHover(hit, opts.tooltipSub ? opts.tooltipSub(d) : opts.label(d), opts.valueLabel(d));
  });

  return svg;
}

function buildTable(container, headers, rows) {
  const btn = document.createElement("button");
  btn.className = "table-toggle";
  btn.textContent = "Показать таблицей";
  const table = document.createElement("table");
  table.className = "data-table";
  const thead = document.createElement("tr");
  headers.forEach(h => { const th = document.createElement("th"); th.textContent = h; thead.appendChild(th); });
  table.appendChild(thead);
  rows.forEach(r => {
    const tr = document.createElement("tr");
    r.forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    table.appendChild(tr);
  });
  btn.addEventListener("click", () => {
    const showing = table.classList.toggle("visible");
    btn.textContent = showing ? "Скрыть таблицу" : "Показать таблицей";
  });
  container.appendChild(btn);
  container.appendChild(table);
}

// ---- Panel: beeswarm — Trent in the context of the full league ----
function renderBeeswarmPanel() {
  const root = document.getElementById("panel-beeswarm");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>Пропущенные голы/90 — все защитники топ-5 лиг</h2>
    <p class="desc">${BEESWARM_DATA.values.length} защитников (мин. 10×90 минут). Каждая точка — игрок.</p>`;
  root.appendChild(card);

  const values = BEESWARM_DATA.values;
  const width = 600, height = 260;
  const leftPad = 12, rightPad = 12, topPad = 16, bottomPad = 28;
  const plotW = width - leftPad - rightPad;
  const min = Math.min(...values), max = Math.max(...values);
  const sorted = [...values].sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];

  const xScale = v => leftPad + ((v - min) / (max - min)) * plotW;

  // Simple beeswarm: bin by x, stack vertically within each bin.
  const r = 3, gap = 1;
  const binWidth = (r * 2 + gap);
  const nBins = Math.ceil(plotW / binWidth);
  const bins = new Array(nBins).fill(0);
  const centerY = (height - topPad - bottomPad) / 2 + topPad;

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Распределение пропущенных голов на 90 минут по защитникам" }, card);

  // Median reference line
  const medianX = xScale(median);
  el("line", { class: "median-line", x1: medianX, x2: medianX, y1: topPad, y2: height - bottomPad }, svg);
  text("медиана лиги: " + median.toFixed(2), medianX, topPad - 4, "axis-label", "middle", svg);

  values.forEach(v => {
    const bin = Math.min(nBins - 1, Math.floor((xScale(v) - leftPad) / binWidth));
    const stack = bins[bin]++;
    const side = stack % 2 === 0 ? 1 : -1;
    const depth = Math.ceil(stack / 2);
    const y = centerY + side * depth * (r * 2 + gap);
    const cx = leftPad + bin * binWidth + binWidth / 2;
    el("circle", { cx, cy: y, r, fill: "var(--baseline)", opacity: 0.55 }, svg);
  });

  BEESWARM_DATA.highlights.forEach((h, i) => {
    const cx = xScale(h.ga_per90);
    const cy = centerY + (i === 0 ? -1 : 1) * 46;
    el("line", { x1: cx, x2: cx, y1: centerY, y2: cy, stroke: "var(--series-3)", "stroke-width": 1 }, svg);
    const hit = el("circle", { cx, cy, r: 7, fill: "var(--series-3)", stroke: "var(--surface-1)", "stroke-width": 2, class: "dot-hit", tabindex: "0", role: "button" }, svg);
    hit.style.fill = "var(--series-3)";
    hit.style.cursor = "pointer";
    text(h.player, cx, cy + (i === 0 ? -12 : 20), "bar-value", "middle", svg);
    text(`${h.ga_per90.toFixed(2)} · лучше ${h.percentile_better_than_pct}% лиги`, cx, cy + (i === 0 ? -1 : 33), "bar-sub", "middle", svg);
    wireHover(hit, `${h.squad} · лучше ${h.percentile_better_than_pct}% защитников лиги`, h.ga_per90.toFixed(2));
  });

  text(min.toFixed(1), leftPad, height - 8, "axis-label", "start", svg);
  text(max.toFixed(1), width - rightPad, height - 8, "axis-label", "end", svg);
  text("← лучше защита    хуже защита →", width / 2, height - 8, "axis-label", "middle", svg);

  const callout = document.createElement("div");
  callout.className = "callout";
  callout.style.background = "color-mix(in srgb, var(--series-3) 12%, transparent)";
  callout.innerHTML = `<span class="icon" style="color:var(--series-3)">i</span><span>В масштабах всей лиги Александер-Арнольд лучше 79.5% защитников — просто у «Реала» в целом сильная защита, и на её фоне он выглядит слабым звеном именно в сравнении со своими же партнёрами. Милитау — топ-2% лиги.</span>`;
  card.appendChild(callout);
}

// ---- Panel: quadrant scatter — attack vs defense, all 96 teams ----
function renderQuadrantPanel() {
  const root = document.getElementById("panel-quadrant");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>Атака vs защита — все команды топ-5 лиг</h2>
    <p class="desc">X: суммарные Г+П команды · Y: ГА/90 на поле у защитников (инвертировано — выше = лучше защита)</p>`;
  root.appendChild(card);

  const data = QUADRANT_DATA;
  const width = 600, height = 460;
  const pad = { l: 34, r: 16, t: 16, b: 34 };
  const plotW = width - pad.l - pad.r, plotH = height - pad.t - pad.b;

  const xVals = data.map(d => d.total_ga), yVals = data.map(d => d.avg_def_ga90);
  const xMin = Math.min(...xVals) * 0.95, xMax = Math.max(...xVals) * 1.05;
  const yMin = Math.min(...yVals) * 0.9, yMax = Math.max(...yVals) * 1.05;
  const xScale = v => pad.l + ((v - xMin) / (xMax - xMin)) * plotW;
  // Inverted: lower avg_def_ga90 (better defense) plots higher on screen.
  const yScale = v => pad.t + ((v - yMin) / (yMax - yMin)) * plotH;

  const sorted = [...xVals].sort((a, b) => a - b);
  const xMedian = sorted[Math.floor(sorted.length / 2)];
  const ySorted = [...yVals].sort((a, b) => a - b);
  const yMedian = ySorted[Math.floor(ySorted.length / 2)];

  const svg = el("svg", { class: "chart", viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "Атака против защиты по всем командам" }, card);

  el("line", { class: "median-line", x1: xScale(xMedian), x2: xScale(xMedian), y1: pad.t, y2: height - pad.b }, svg);
  el("line", { class: "median-line", x1: pad.l, x2: width - pad.r, y1: yScale(yMedian), y2: yScale(yMedian) }, svg);

  text("сильная защита, сильная атака", width - pad.r, pad.t + 10, "quadrant-label", "end", svg);
  text("слабая защита, сильная атака", width - pad.r, height - pad.b - 4, "quadrant-label", "end", svg);
  text("сильная защита, слабая атака", pad.l, pad.t + 10, "quadrant-label", "start", svg);
  text("слабая защита, слабая атака", pad.l, height - pad.b - 4, "quadrant-label", "start", svg);

  text("Г+П команды →", width / 2, height - 6, "axis-label", "middle", svg);

  const labelOffsets = {
    "Real Madrid": { dx: 8, dy: -14 },
    "Manchester City": { dx: -8, dy: 14 },
    "Arsenal": { dx: 8, dy: 4 },
    "Barcelona": { dx: 8, dy: -4 },
    "Atlético Madrid": { dx: 8, dy: 14 }
  };

  data.forEach(d => {
    const isHighlight = !!TEAM_COLOR[d.team];
    const cx = xScale(d.total_ga), cy = yScale(d.avg_def_ga90);
    const r = isHighlight ? 6 : 3;
    const fill = isHighlight ? TEAM_COLOR[d.team] : "var(--baseline)";
    el("circle", { cx, cy, r, fill, opacity: isHighlight ? 1 : 0.5 }, svg);
    if (isHighlight) {
      const off = labelOffsets[d.team] || { dx: 8, dy: -8 };
      text(d.team, cx + off.dx, cy + off.dy, "bar-value", off.dx < 0 ? "end" : "start", svg);
    }
    const hit = el("circle", { cx, cy, r: Math.max(r, 10), class: "dot-hit", tabindex: "0", role: "button" }, svg);
    wireHover(hit, `${d.team} (${d.comp.replace(/^[a-z]+ /, "")})`, `Г+П: ${d.total_ga} · ГА/90: ${d.avg_def_ga90.toFixed(2)}`);
  });

  const callout = document.createElement("div");
  callout.className = "callout";
  callout.style.background = "color-mix(in srgb, var(--series-1) 10%, transparent)";
  callout.innerHTML = `<span class="icon" style="color:var(--series-1)">i</span><span>Все 5 команд сидят в квадранте «сильная атака и защита» среди 96 клубов топ-5 лиг — но «Арсенал» держит лучшую защиту даже в этой элитной компании, при самой скромной атаке из пяти.</span>`;
  card.appendChild(callout);

  buildTable(card, ["Команда", "Г+П", "ГА/90 защитников"],
    [...data].filter(d => TEAM_COLOR[d.team]).sort((a, b) => a.avg_def_ga90 - b.avg_def_ga90)
      .map(d => [d.team, d.total_ga, d.avg_def_ga90.toFixed(2)]));
}

// ---- Panel: radar — single player percentile profile ----
function renderRadarPanel() {
  const root = document.getElementById("panel-radar");
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${RADAR_DATA.player} — профиль по перцентилям</h2>
    <p class="desc">Место среди ${RADAR_DATA.n_population} защитников топ-5 лиг. 100 = лучший в лиге по метрике, 50 = медиана.</p>`;
  root.appendChild(card);

  const entries = Object.entries(RADAR_DATA.metrics);
  const N = entries.length;
  const size = 600, cx = size / 2, cy = 260, maxR = 170;
  const svg = el("svg", { class: "chart", viewBox: `0 0 ${size} 520`, role: "img", "aria-label": "Перцентильный профиль игрока" }, card);

  const angle = i => -Math.PI / 2 + i * (2 * Math.PI / N);

  // Grid rings
  [20, 40, 60, 80, 100].forEach(step => {
    const pts = entries.map((_, i) => {
      const rr = (step / 100) * maxR;
      return `${cx + rr * Math.cos(angle(i))},${cy + rr * Math.sin(angle(i))}`;
    }).join(" ");
    el("polygon", { points: pts, class: "radar-grid" }, svg);
  });
  // 50th-percentile reference ring (league average), dashed.
  const refPts = entries.map((_, i) => {
    const rr = 0.5 * maxR;
    return `${cx + rr * Math.cos(angle(i))},${cy + rr * Math.sin(angle(i))}`;
  }).join(" ");
  el("polygon", { points: refPts, class: "radar-ref" }, svg);

  // Axis lines + labels
  entries.forEach(([label], i) => {
    const a = angle(i);
    el("line", { x1: cx, y1: cy, x2: cx + maxR * Math.cos(a), y2: cy + maxR * Math.sin(a), class: "radar-grid" }, svg);
    const lx = cx + (maxR + 22) * Math.cos(a), ly = cy + (maxR + 22) * Math.sin(a);
    const anchor = Math.abs(Math.cos(a)) < 0.3 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    label.split(" ").forEach((word, wi) => {
      text(word, lx, ly + wi * 12, "radar-axis-label", anchor, svg);
    });
  });

  // Data polygon
  const dataPts = entries.map(([, v], i) => {
    const rr = (v / 100) * maxR;
    return [cx + rr * Math.cos(angle(i)), cy + rr * Math.sin(angle(i))];
  });
  el("polygon", { points: dataPts.map(p => p.join(",")).join(" "), fill: "var(--series-3)", opacity: 0.22, stroke: "var(--series-3)", "stroke-width": 2 }, svg);

  entries.forEach(([, v], i) => {
    const [x, y] = dataPts[i];
    el("circle", { cx: x, cy: y, r: 4, fill: "var(--series-3)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    const a = angle(i);
    text(v.toFixed(0), x + 10 * Math.cos(a), y + 10 * Math.sin(a) - 4, "bar-value", "middle", svg);
  });

  const callout = document.createElement("div");
  callout.className = "callout";
  callout.style.background = "color-mix(in srgb, var(--series-3) 12%, transparent)";
  callout.innerHTML = `<span class="icon" style="color:var(--series-3)">i</span><span>Профиль явно несимметричный: элитная атакующая отдача для защитника (97.5-й перцентиль), приличная базовая защита (79.5), но низкая дисциплина (16), мало отборов+перехватов (43.7) и заметно урезанное игровое время (9.7) — похоже на игрока, который ещё адаптируется физически и тактически.</span>`;
  card.appendChild(callout);

  buildTable(card, ["Метрика", "Перцентиль"], entries.map(([k, v]) => [k, v.toFixed(1)]));
}

renderConcentrationPanel();

// ---- Telegram Web App integration (guarded — works fine outside Telegram too) ----
(function loadTelegramSDK() {
  try {
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-web-app.js";
    s.onload = () => {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        tg.ready();
        tg.expand();
        document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
        tg.onEvent("themeChanged", () => {
          document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light";
        });
      } catch (e) { /* not running inside Telegram — ignore */ }
    };
    s.onerror = () => { /* blocked or offline — page still works standalone */ };
    document.head.appendChild(s);
  } catch (e) { /* ignore */ }
})();
